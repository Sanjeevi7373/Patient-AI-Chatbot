<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            /* Background image settings - SAME AS LOGIN.HTML */
            background-image: url("{{ url_for('static', filename='images/chatbot_background.png') }}");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white; /* Ensure text is visible over the dark background */
        }
        .register-box { /* Changed from .login-box for semantic clarity, but styles can be similar */
            background: rgba(0, 0, 0, 0.7); /* Dark, semi-transparent background for the form */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.5); /* Glowing blue shadow */
            text-align: center;
            width: 300px;
        }
        h1 {
            margin-bottom: 20px;
            color: #00c8ff;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00c8ff;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 5px;
        }
        button {
            background-color: #00c8ff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00a0cc;
        }
        a {
            color: #00c8ff;
            text-decoration: none;
        }
        .error {
            color: #ff6347;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>Register</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" id="username" name="username" placeholder="Choose Username" required><br>
            <input type="password" id="password" name="password" placeholder="Choose Password" required><br>
            <button type="submit">Register Account</button>
        </form>
        <p style="margin-top: 20px;">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</body>
</html>
