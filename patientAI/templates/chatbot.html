<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Chatbot</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            /* Background image settings */
            background-image: url("{{ url_for('static', filename='images/chatbot_background.png') }}");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white; 
        }
        .chat-container { 
            width: 100%; 
            max-width: 450px; 
            height: 90vh; 
            /* Use semi-transparent background for the white box */
            background: rgba(255, 255, 255, 0.9); 
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.5); 
            border-radius: 8px; 
            overflow: hidden;
            
            /* KEY FIX: Enable Flex Column Layout */
            display: flex; 
            flex-direction: column;
        }
        .chat-messages { 
            /* KEY FIX: Allow this section to grow and enable scrolling */
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .chat-input { 
            padding: 10px; 
            border-top: 1px solid #ddd; 
            display: flex; 
            gap: 5px; 
            /* Ensure the input section is at the bottom */
            flex-shrink: 0; 
        }
        .chat-input input { 
            flex-grow: 1; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        .chat-input button { 
            padding: 8px 15px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        /* Message bubble styles (for clarity) */
        .message { display: flex; }
        .user-message { justify-content: flex-end; }
        .assistant-message { justify-content: flex-start; }
        .user-bubble { background: #bfdbfe; color: #1e40af; padding: 8px 12px; border-radius: 12px 12px 0 12px; max-width: 80%; white-space: pre-line; }
        .assistant-bubble { background: #e5e7eb; color: #1f2937; padding: 8px 12px; border-radius: 12px 12px 12px 0; max-width: 80%; white-space: pre-line; }
        .system-bubble { background: #f0f0f0; color: #6b7280; padding: 8px 12px; border-radius: 12px; max-width: 90%; text-align: center; }
        .banner { padding: 10px; background: #eff6ff; border-bottom: 1px solid #dbeafe; font-size: 0.85rem; text-align: center; color: #1f2937; }
        .logout-link { position: absolute; top: 10px; right: 10px; font-size: 0.9rem; color: #00c8ff; }
    </style>
</head>
<body>
    <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>

    <div class="chat-container">
        <div class="banner">
            For emergencies, call your local emergency number. This chatbot does not provide medical diagnosis.
        </div>
        
        <div class="chat-messages" id="message-list">
            {% for msg in messages %}
            <div class="message {{ msg.role }}-message">
                <div class="{% if msg.role == 'system' %}system-bubble{% else %}{{ msg.role }}-bubble{% endif %}">
                    {{ msg.content }}
                </div>
            </div>
            {% endfor %}
        </div>
        
        <form class="chat-input" id="chat-form">
            <input type="text" id="user-input" placeholder="Type your message..." required>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        // (Your existing JavaScript code for handling chat interaction goes here)
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const messageList = document.getElementById('message-list');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.role}-message`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = (msg.role === 'system') ? 'system-bubble' : `${msg.role}-bubble`;
            bubbleDiv.textContent = msg.content;
            
            msgDiv.appendChild(bubbleDiv);
            messageList.appendChild(msgDiv);
            messageList.scrollTop = messageList.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            sendBtn.disabled = true;
            input.disabled = true;
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message }),
                });

                if (!response.ok) {
                    throw new Error('Chat failed');
                }

                const data = await response.json();
                
                messageList.innerHTML = ''; 
                data.messages.forEach(appendMessage);
                
            } catch (error) {
                console.error("Error sending message:", error);
                appendMessage({ role: 'system', content: 'An error occurred. Please try again.', ts: new Date().toLocaleTimeString() });
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        });

        // Scroll to bottom on load
        messageList.scrollTop = messageList.scrollHeight;
    </script>
</body>
</html>
